<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borja & Miriam - Nuestra Boda</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #f6ede1 0%, #ead9c4 100%);
    color: #4a3f35;
    text-align:center;
    padding: 24px;
  }
  .card {
    max-width: 520px;
    width:100%;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    backdrop-filter: blur(4px);
  }
  .photo-wrap {
    width: 180px; height: 180px;
    border-radius: 50%;
    overflow:hidden;
    margin: 0 auto 24px;
    border: 4px solid #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .photo-wrap img {
    width:100%; height:100%; object-fit:cover;
  }
  .names {
    font-size: 2.2rem;
    letter-spacing: 1px;
    color:#5c4a3a;
    margin-bottom: 8px;
  }
  .names .amp {
    font-style: italic;
    font-size: 1.6rem;
    color:#b98a5e;
    padding: 0 8px;
  }
  .date {
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color:#8a7568;
    margin-bottom: 24px;
  }
  .divider {
    width: 60px; height:1px;
    background:#c9a876;
    margin: 20px auto;
  }
  .status {
    font-size: 1rem;
    line-height: 1.6;
    color:#6b5d4f;
  }
  .status strong {
    color:#b98a5e;
  }
  footer {
    margin-top: 24px;
    font-size: 0.8rem;
    color:#9a8b7a;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo-wrap">
      <img src="imgs/borjamiriam.jpeg" alt="Borja y Miriam">
    </div>
    <div class="names">Borja <span class="amp">&amp;</span> Miriam</div>
    <div class="date">11 de Octubre de 2026</div>
    <div class="divider"></div>
    <p class="status">Estamos preparando algo especial.<br>Nuestra web de boda <strong>está en construcción</strong>.<br>¡Vuelve pronto!</p>
    <footer>Gracias por tu paciencia ♥</footer>
  </div>
</body>
</html>
